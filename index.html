  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

div class=\"foot\"><button type=\"button\" class=\"{{sendCls}}\" sc-camel-on-click=\"{{submit}}\">Ajukan sekarang<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{sv.cm_thanks}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"{{sc.cm_thanks}}\">\n<div class=\"sbspace\"><\u002Fdiv>\n<div class=\"appbar\"><span style=\"width: 12px\"><\u002Fspan><div class=\"ab-title\">Tokopedia <small>by Cermati<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n<div class=\"body\">\n<div class=\"thx-top\">\n<span class=\"bigcheck\"><svg class=\"ck\" sc-camel-view-box=\"0 0 52 52\" aria-hidden=\"true\"><path class=\"ck-p\" d=\"M14 27l8 8 16-17\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<h2>Terima kasih!<\u002Fh2>\n<p>Customer Support kami akan menghubungi kamu dalam 1 hari kerja untuk melanjutkan pengajuan ke {{pName}}.<\u002Fp>\n<div class=\"refbox\">No. pengajuan <b>{{leadRef}}<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n<h3>Simulasi kredit<\u002Fh3>\n<div class=\"sum-r\" style=\"margin-top: 8px\"><span>Jenis jaminan<\u002Fspan><b>{{cmJenisLabel}}<\u002Fb><\u002Fdiv>\n<div class=\"sum-r\"><span>Jumlah pinjaman<\u002Fspan><b>Rp{{f.amount}}<\u002Fb><\u002Fdiv>\n<div class=\"sum-r\"><span>Lama pinjaman<\u002Fspan><b>{{f.tenor}} bulan<\u002Fb><\u002Fdiv>\n<div class=\"sum-r\"><span>Cicilan per bulan<\u002Fspan><b>[dihitung partner]<\u002Fb><\u002Fdiv>\n<p class=\"fine\">Nominal akhir ditentukan {{pName}} setelah verifikasi dan taksasi jaminan.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card\">\n<h3>Status pengajuan<\u002Fh3>\n<p class=\"sub\">Status diperbarui setelah setiap tahap.<\u002Fp>\n<ul class=\"stl\"><sc-for list=\"{{cmStl}}\" as=\"x\" hint-placeholder-count=\"5\"><li class=\"{{x.cls}}\"><span class=\"dot\"><\u002Fspan><span class=\"grow\">{{x.t}}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful>\n<sc-if value=\"{{cmCanNext}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"wsim tap\" sc-camel-on-click=\"{{cmNext}}\"><span class=\"wsim-k\">Simulasi<\u002Fspan><span>{{cmNextLabel}}<\u002Fspan><\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<div class=\"card helpc\">\n<span class=\"wico\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chat\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<div><p>Belum dihubungi dalam 1 hari kerja? Hubungi WhatsApp 08XX-XXXX-XXXX atau email [email CS Cermati].<\u002Fp><p class=\"sub\">Pastikan nomor WhatsApp yang kamu isi benar dan aktif.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card xsell\">\n<span class=\"ti ti-k_angsuran\"><\u002Fspan>\n<p>Kalau pinjaman sudah cair, bayar angsuran {{pName}} tiap bulan di Tokopedia.<\u002Fp>\n<button type=\"button\" class=\"link tap\" sc-camel-on-click=\"{{crossSell}}\">Lihat Angsuran Kredit<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"endpad\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"foot\"><button type=\"button\" class=\"cta tap\" sc-camel-on-click=\"{{backHome}}\">Kembali ke Tokopedia<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"{{toastCls}}\" role=\"status\" aria-live=\"polite\">{{toast}}<\u002Fdiv>\n<div class=\"homeind\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"caption\"><span class=\"sq\"><\u002Fspan>marks an entry point. Tap anywhere else in the phone to see what is tappable. Arrow keys step through the screens.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"{{drawerCls}}\">\n<div class=\"dr-head\">\n<span class=\"dr-grab\"><\u002Fspan>\n<div class=\"dr-tabs\" role=\"tablist\" aria-label=\"Review panel\">\n<button type=\"button\" role=\"tab\" class=\"{{tabNotesCls}}\" aria-selected=\"{{isTabNotes}}\" sc-camel-on-click=\"{{tabNotes}}\">Notes<\u002Fbutton>\n<button type=\"button\" role=\"tab\" class=\"{{tabTrackCls}}\" aria-selected=\"{{isTabTrack}}\" sc-camel-on-click=\"{{tabTrack}}\">Tracking<span class=\"dr-n\">{{logCount}}<\u002Fspan><\u002Fbutton>\n<button type=\"button\" role=\"tab\" class=\"{{tabScreensCls}}\" aria-selected=\"{{isTabScreens}}\" sc-camel-on-click=\"{{tabScreens}}\">Screens<\u002Fbutton>\n<\u002Fdiv>\n<button type=\"button\" class=\"ib\" aria-label=\"Close review panel\" sc-camel-on-click=\"{{closeSheet}}\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-close\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n\n<nav class=\"flowmap\" aria-label=\"Flow map\">\n<div class=\"fm-h\">Flow map<\u002Fdiv>\n<sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"6\">\n<div class=\"{{g.cls}}\">\n<div class=\"fm-gname\">{{g.name}}<\u002Fdiv>\n<sc-for list=\"{{g.items}}\" as=\"it\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"{{it.cls}}\" aria-current=\"{{it.cur}}\" sc-camel-on-click=\"{{it.go}}\"><span class=\"fm-code\">{{it.code}}<\u002Fspan><span class=\"fm-txt\">{{it.title}}<span class=\"fm-id\">{{it.id}}<\u002Fspan><\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fnav>\n\n<div class=\"dr-ctl\">\n<label class=\"cb\"><input type=\"checkbox\" checked=\"{{markEP}}\" sc-camel-on-change=\"{{toggleMark}}\"> Mark entry points<\u002Flabel>\n<label class=\"cb\"><input type=\"checkbox\" checked=\"{{showTaps}}\" sc-camel-on-change=\"{{toggleTaps}}\"> Show tap areas<\u002Flabel>\n<button type=\"button\" class=\"btn-reset\" sc-camel-on-click=\"{{reset}}\">Reset<\u002Fbutton>\n<\u002Fdiv>\n\n<aside class=\"panel\" aria-label=\"Review notes and tracking\">\n<section class=\"pn-model\">\n<div class=\"pn-h\">Operating model<\u002Fdiv>\n<sc-if value=\"{{isM1}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"mcard m1\">\n<h2 class=\"mc-h\">Model 1: Direct entry point<\u002Fh2>\n<div class=\"mc-flow\"><span class=\"mc-step\">Entry point<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Discovery<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Transition page<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Partner site<\u002Fspan><\u002Fdiv>\n<p class=\"mc-row\"><b>Tokopedia owns:<\u002Fb> the entry points, click tracking, and the CTR and click reports.<\u002Fp>\n<p class=\"mc-row\"><b>Partner owns:<\u002Fb> the whole journey on its own jump app or web URL: application, survey, offer, agreement and disbursement (Indodana deck). Tokopedia has no visibility after the redirect.<\u002Fp>\n<p class=\"mc-row\"><b>Commercial:<\u002Fb> placement fee per partner, or a % of approved loan.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{isM2}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"mcard m2\">\n<h2 class=\"mc-h\">Model 2: Cermati white-label<\u002Fh2>\n<div class=\"mc-flow\"><span class=\"mc-step\">Entry point<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Discovery<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Transition page<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Cermati product list<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Lead form<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">CS call<\u002Fspan><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#ic-chev-r\"><\u002Fuse><\u002Fsvg><span class=\"mc-step\">Partner<\u002Fspan><\u002Fdiv>\n<p class=\"mc-row\"><b>Cermati owns:<\u002Fb> the product list, the lead form, the Customer Support call and the lead status, then forwards the lead to the partner.<\u002Fp>\n<p class=\"mc-row\"><b>Tokopedia owns:<\u002Fb> the entry points and click tracking up to the webview hand-off.<\u002Fp>\n<p class=\"mc-row\"><b>Commercial:<\u002Fb> revenue share from Cermati.<\u002Fp>\n<p class=\"mc-row\">Insurance still redirects to the insurer in this mode.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section class=\"pn-notes\">\n<div class=\"pn-h\">Review notes<\u002Fdiv>\n<div class=\"rv-head\"><span class=\"pill-code\">{{cur.code}}<\u002Fspan><h2 class=\"rv-title\">{{cur.title}}<\u002Fh2><span class=\"{{cur.ownerCls}}\">{{cur.ownerLabel}}<\u002Fspan><\u002Fdiv>\n<div class=\"stickies\">\n<div class=\"sticky y\"><h3>What happens here<\u002Fh3><p>{{cur.what}}<\u002Fp><\u002Fdiv>\n<div class=\"sticky g\"><h3>Notes<\u002Fh3><ul><sc-for list=\"{{cur.notes}}\" as=\"n\" hint-placeholder-count=\"2\"><li>{{n.t}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<div class=\"sticky p\"><h3>Open questions<\u002Fh3><ul><sc-for list=\"{{cur.open}}\" as=\"q\" hint-placeholder-count=\"2\"><li>{{q.t}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"src-line\">Source: {{cur.source}}<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"pn-track\">\n<div class=\"log-h\"><div><div class=\"pn-h\">Tracking preview<\u002Fdiv><div class=\"pn-sub\">Proposed event names<\u002Fdiv><\u002Fdiv><button type=\"button\" class=\"clr\" sc-camel-on-click=\"{{clearLog}}\">Clear<\u002Fbutton><\u002Fdiv>\n<sc-if value=\"{{logEmpty}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"log-empty\">Tap through the prototype to see events here.<\u002Fdiv><\u002Fsc-if>\n<div class=\"log\">\n<sc-for list=\"{{log}}\" as=\"r\" hint-placeholder-count=\"3\">\n<div class=\"lg-row\">\n<div class=\"lg-top\"><span class=\"ltime\">{{r.t}}<\u002Fspan><span class=\"{{r.pillCls}}\">{{r.srcLabel}}<\u002Fspan><\u002Fdiv>\n<div class=\"{{r.nameCls}}\">{{r.name}}<\u002Fdiv>\n<sc-if value=\"{{r.hasRows}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"lpay\"><sc-for list=\"{{r.rows}}\" as=\"kv\" hint-placeholder-count=\"2\"><div>{{kv.k}}: {{kv.v}}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Faside>\n<\u002Fdiv>\n<div class=\"{{scrimCls}}\" sc-camel-on-click=\"{{closeSheet}}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nvar NA = 'Belum tersedia di prototype';\nvar P = {\n  muf: { id: 'muf', name: 'MUF', tile: 'MUF', cat: 'loan' },\n  idd: { id: 'idd', name: 'Indodana', tile: 'Indodana', cat: 'loan' },\n  bfi: { id: 'bfi', name: 'BFI Finance', tile: 'BFI', cat: 'loan' },\n  axa: { id: 'axa', name: 'AXA Insurance', tile: 'AXA', cat: 'ins' },\n  alz: { id: 'alz', name: 'Allianz', tile: 'Allianz', cat: 'ins' },\n  car: { id: 'car', name: 'CAR', tile: 'CAR', cat: 'ins' },\n  fh: { id: 'fh', name: 'FundedHere', tile: 'FH', cat: 'biz' }\n};\nvar BIZ = ['fh'];\nvar LOANS = ['muf', 'idd', 'bfi'];\nvar INS = ['axa', 'alz', 'car'];\nvar COLL = [\n  { id: 'bpkb_motor', label: 'BPKB Motor', icon: 'du-motor' },\n  { id: 'bpkb_mobil', label: 'BPKB Mobil', icon: 'du-car' },\n  { id: 'sertifikat', label: 'Sertifikat Rumah/Ruko', icon: 'du-house' }\n];\nvar CL = { bpkb_motor: 'BPKB Motor', bpkb_mobil: 'BPKB Mobil', sertifikat: 'Sertifikat Rumah/Ruko' };\n// Product check, Nov 2026 (partner product pages and Cermati): MUF and Indodana take BPKB motor and mobil. BFI also takes sertifikat rumah, ruko and rukan.\nvar SUPPORT = { muf: ['bpkb_motor', 'bpkb_mobil'], idd: ['bpkb_motor', 'bpkb_mobil'], bfi: ['bpkb_motor', 'bpkb_mobil', 'sertifikat'] };\nfunction okFor(pid, coll) { return !coll || !SUPPORT[pid] || SUPPORT[pid].indexOf(coll) >= 0; }\nfunction firstFor(coll) { return LOANS.filter(function (pid) { return okFor(pid, coll); })[0] || null; }\nfunction collMsg(pid) {\n  var w = (SUPPORT[pid] || []).map(function (c) { return CL[c]; });\n  return P[pid].name + ' menerima jaminan ' + (w.length > 1 ? w.slice(0, -1).join(', ') + ' dan ' + w[w.length - 1] : w.join('')) + '. Pilih salah satunya, ya.';\n}\nvar D_COLL = 'bpkb_motor';\nvar INS_T = {\n  mobil: { label: 'Asuransi Mobil', icon: 'du-car', key: 'asuransi_mobil' },\n  kesehatan: { label: 'Asuransi Kesehatan', icon: 'du-health', key: 'asuransi_kesehatan' },\n  perjalanan: { label: 'Asuransi Perjalanan', icon: 'du-plane', key: 'asuransi_perjalanan' }\n};\n// AXA partner is PT AXA Insurance Indonesia (general insurer). Allianz: car, health, travel. CAR (life insurer): health only.\nvar INS_SUPPORT = { axa: ['mobil', 'kesehatan', 'perjalanan'], alz: ['mobil', 'kesehatan', 'perjalanan'], car: ['kesehatan'] };\nvar INS_PN = { alz: { mobil: 'Allianz Mobilku' }, axa: { mobil: 'AXA SmartDrive', kesehatan: 'AXA SmartMedicare', perjalanan: 'AXA SmartTravel' } };\nfunction insPn(pid, t) { return (INS_PN[pid] || {})[t] || ''; }\nfunction insOk(pid, t) { return !t || !INS_SUPPORT[pid] || INS_SUPPORT[pid].indexOf(t) >= 0; }\nfunction insTypeOf(pid, t) { var sup = INS_SUPPORT[pid] || ['mobil', 'kesehatan', 'perjalanan']; return (t && sup.indexOf(t) >= 0) ? t : sup[0]; }\nvar D_INS = 'mobil';\n// Allianz Mobilku (PT Asuransi Allianz Utama Indonesia). Only benefits that both Mobilku documents state the same way.\nvar MK_PLANS = [\n  { t: 'Mobilku Eco', feats: ['Tanggung jawab hukum pihak ketiga hingga Rp55 juta', 'Kecelakaan diri pengemudi dan penumpang hingga Rp10 juta per orang'] },\n  { t: 'Mobilku Grand', feats: ['Tanggung jawab hukum pihak ketiga hingga Rp75 juta', 'Penggantian tunai kerusakan ringan hingga Rp1,5 juta (Komprehensif)'] },\n  { t: 'Mobilku Non Paket', feats: ['Perlindungan dasar sesuai jenis pertanggungan', 'Perluasan kamu pilih sendiri sesuai kebutuhan'] }\n];\nvar MK_EXT = [['banjir', 'Angin topan, badai, banjir, dan tanah longsor'], ['gempa', 'Gempa bumi, tsunami, dan letusan gunung berapi'], ['huru', 'Pemogokan, kerusuhan, dan huru-hara'], ['teror', 'Terorisme dan sabotase'], ['tjh', 'Tanggung jawab hukum pihak ketiga'], ['pa', 'Kecelakaan diri pengemudi dan penumpang']];\nvar MK_OPT = [['drv', 'Pencurian oleh pengemudi'], ['valet', 'Perlindungan layanan valet'], ['pa24', 'Kecelakaan diri 24 jam hingga Rp100 juta']];\nvar SCR = {\n  dg: { code: '1(a) 1(c)', title: 'Top-up & Tagihan', group: 'entry', owner: 'tkp', source: 'BRD 1(a), 1(c)' },\n  home: { code: '1(b)', title: 'Beranda', group: 'entry', owner: 'tkp', source: 'BRD 1(b)' },\n  discovery: { code: '2(a)', title: 'Pengajuan Pinjaman & Asuransi', group: 'landing', owner: 'tkp', source: 'BRD 2(a)' },\n  jelajah: { code: '2(b)', title: 'Jelajah Tokopedia', group: 'landing', owner: 'tkp', source: 'BRD 1(b), 2(b)' },\n  kategori: { code: '2(c)', title: 'Semua Kategori', group: 'landing', owner: 'tkp', source: 'BRD 1(c), 2(c)' },\n  transition: { code: 'Hand-off', title: 'Transition page', group: 'handoff', owner: 'tkp', source: 'BRD 2 and 3 (hand-off), copy pending Legal review' },\n  partner_site: { code: '3', title: 'Partner site', group: 'm1', owner: 'partner', source: 'BRD 3, 4.2.1; Indodana Jamin BPKB deck, steps 2 to 26' },\n  cm_landing: { code: '3', title: 'Cermati product list', group: 'm2', owner: 'cm', source: 'BRD 3, 4.3; cermati.com Pinjaman dengan Jaminan pages' },\n  cm_detail: { code: '3', title: 'Cermati product detail', group: 'm2', owner: 'cm', source: 'BRD 3, 4.3; cermati.com Indodana product pages' },\n  cm_apply: { code: '3', title: 'Cermati lead form', group: 'm2', owner: 'cm', source: 'BRD 3, 4.3; Cermati Jamin BPKB promo form' },\n  cm_thanks: { code: '4', title: 'Thank-you page', group: 'm2', owner: 'cm', source: 'BRD 4, 4.3.3; Cermati confirmation page' },\n  insurer_site: { code: '3', title: 'Insurer site', group: 'ins', owner: 'insurer', source: 'BRD 3; Cermati insurance pages and purchase guides' }\n};\nvar ORDER = ['dg', 'home', 'discovery', 'jelajah', 'kategori', 'transition', 'partner_site', 'cm_landing', 'cm_detail', 'cm_apply', 'cm_thanks', 'insurer_site'];\nvar GROUPS = [\n  { id: 'entry', name: 'Entry points', rail: '' },\n  { id: 'landing', name: 'Landing pages', rail: '' },\n  { id: 'handoff', name: 'Hand-off', rail: '' },\n  { id: 'm1', name: 'Model 1: partner site', rail: 'blue' },\n  { id: 'm2', name: 'Model 2: Cermati white-label', rail: 'violet' },\n  { id: 'ins', name: 'Insurance, both models', rail: 'teal' }\n];\nvar MODAL = { transition: true, partner_site: true, insurer_site: true };\nvar BASE = { home: 'scr hm', transition: 'scr tr' };\nvar STACKS = {\n  home: [], dg: ['home'], jelajah: ['home'], kategori: ['home', 'dg'], discovery: ['home', 'dg'],\n  transition: ['home', 'dg', 'discovery'], partner_site: ['home', 'dg', 'discovery'], insurer_site: ['home', 'dg', 'discovery'],\n  cm_landing: ['home', 'dg', 'discovery'], cm_detail: ['home', 'dg', 'discovery', 'cm_landing'],\n  cm_apply: ['home', 'dg', 'discovery', 'cm_landing'],\n  cm_thanks: ['home', 'dg', 'discovery']\n};\nvar OWN = {\n  tkp: ['owner tkp', 'Tokopedia'], cm: ['owner cm', 'Cermati'],\n  partner: ['owner ext', 'Partner, out of scope'], insurer: ['owner ext', 'Insurer, out of scope']\n};\nvar SRC = { tkp: 'Tokopedia', cm: 'Cermati', prop: 'Proposed', note: 'Note' };\nvar JEL_Q = ['Who owns the new Jelajah section, and what is the lead time to ship it?', 'Is there a cap on partner icons, and is visibility guaranteed for each paying partner?'];\nvar NOTES = {\n  dg: {\n    what: 'The real Top-up & Tagihan page. Entry point 1(a) is the first banner in the carousel under the hero, and it opens the discovery landing page (2a). Semua Kategori in the grid is the path to entry point 1(c).',\n    notes: ['The impression fires when the page opens, the click fires on banner tap.', 'As in the app, the header turns white on scroll and Kembali ke Atas appears further down.', 'Banner copy follows the OJK ad guideline: no speed, exclusivity, superlative or free claims.', 'Decided: the banner slot is shared with other DG campaigns, and the Marketing Campaign team approves the creatives.', 'Decided: the first slide goes to paying partners, if any. Otherwise the campaign calendar sets which category gets the focus.', 'Grey blocks stand in for modules and third-party banners outside this feature.'],\n    open: ['Who books the slot on the campaign calendar when no partner pays for the first slide?']\n  },\n  home: {\n    what: 'The real Beranda. Top-up & Tagihan in the icon row opens the DG page (1a). Lihat Semua at the end of the row opens Jelajah Tokopedia, where entry point 1(b) lives.',\n    notes: ['Swipe the icon row to reach Lihat Semua. Opening this screen from the flow map scrolls it into view.', 'GoPay Later uses a generic paylater icon because third-party marks stay out of the prototype.', 'Beranda itself does not change in this scope.'],\n    open: JEL_Q\n  },\n  jelajah: {\n    what: 'New accordion section Tokopedia Pengajuan, expanded by default, with loan partners and insurers as tiles. A tile goes straight to the transition page. The link opens the discovery page.',\n    notes: ['The impression fires when the page opens (1b_jelajah_section).', 'A tile tap logs entry_click, then partner_click with via 2b_jelajah.', 'Tiles are monogram placeholders. Final partner assets come from Partnership.'],\n    open: JEL_Q\n  },\n  kategori: {\n    what: 'The real Semua Kategori page. The new block Pengajuan Pinjaman & Asuransi sits right after Bayar, close to Angsuran Kredit and Premi Asuransi.',\n    notes: ['The impression fires when the page opens (1c_kategori_section).', 'Sections collapse and expand as in the app. Opening this screen from the flow map scrolls to the new block.', 'Third-party brand tiles (e-money cards, wallets, Indosat, IndiHome, government marks) use Tokopedia top-up and BPJS icons where the app has them, and generic stand-in icons otherwise. Real partner logos need brand approval first.'],\n    open: ['Keep the block right after Bayar, or move the tiles inside Bayar next to Angsuran Kredit and Premi Asuransi?']\n  },\n  discovery: {\n    what: 'Discovery landing page for the 1(a) banner, built by Tokopedia. BPKB Motor and Asuransi Mobil are selected by default. Each list shows only the partners that offer the selected collateral or insurance type. Every partner row carries the OJK line. Cara kerjanya and the FAQ answers change with the model.',\n    notes: ['The hero repeats the banner message, so the landing matches what the user tapped.', 'The banner logs entry_click, then page_view with from 1a_dg_banner. Jelajah and Kategori tiles skip this page and go straight to the transition page.', 'Collateral and insurance type are single select, so one is always on. The choice travels with the click, without personal data. collateral_select and insurance_select log only when the user changes the default.', 'Partners that do not offer the selected collateral or insurance type are hidden, not greyed out.', 'BFI Finance replaces WOM Finance, because BFI covers all three collaterals.', 'Product check (partner product pages and Cermati, Nov 2026): MUF and Indodana take BPKB motor and mobil. BFI Finance takes BPKB motor, BPKB mobil and sertifikat rumah, ruko or rukan, so it is the only partner under Sertifikat Rumah/Ruko. The empty state stays for any collateral without a partner.', 'Insurance: the AXA partner is PT AXA Insurance Indonesia, the general insurer, with SmartDrive (car), SmartMedicare (health) and SmartTravel (travel). Allianz has Allianz Mobilku (car), health and travel. CAR has health only.', 'Modal usaha untuk seller lists FundedHere. Its row shows its MAS licence, because it holds no OJK licence and cannot carry the OJK line.', \"Decided: Indodana's Jabodetabek-only coverage is left to the partner. The Cermati form keeps its own coverage notice in Model 2.\", 'FAQ taps log faq_click. Current borrowers are pointed to the existing repayment pages.', 'The disclaimer says Tokopedia is not the lender or insurer and keeps no application data.'],\n    open: ['BFI property loans start at Rp100 juta on Cermati and Rp300 juta on bfi.co.id. Which minimum applies to Tokopedia leads?', 'FundedHere is not OJK-licensed. Legal and Compliance to confirm it can be offered to Indonesian sellers, and through which local entity.', 'Seller financing fits Seller Center better than the buyer DG page. Keep FundedHere here for the pilot, or move it?', 'How are partners ordered: by fee, by conversion or by rotation?', 'Who writes and approves the FAQ copy: Legal, Compliance or the partners?']\n  },\n  transition: {\n    what: 'Hand-off between Tokopedia and the partner (Model 1 and insurance) or Cermati (Model 2 loans). It slides up, says who processes the data, then redirects after 3 seconds when opened from a partner tap.',\n    notes: ['Batal goes back and logs redirect_cancel.', 'The page is not kept in back history, so closing the next page returns to where the user tapped.', 'In Model 2 the third line says Customer Support Cermati makes contact, because the real lead form has no email field.', 'Opened from the flow map, it waits for Lanjutkan.', 'FundedHere goes to its own site in both models, and the last line states its MAS licence, not the OJK line.'],\n    open: ['Keep the 3 second auto-redirect, or always require a tap?', 'Legal to confirm the OJK statement and the full legal entity name of each partner.']\n  },\n  partner_site: {\n    what: \"With Indodana, the full Jamin BPKB journey from the Indodana deck, steps 2 to 26, on Indodana's side: product page, brand, model and year, vehicle info, photos, pre-approval amount, bank account, survey method and documents, offer, PIN, BPKB validation, disbursement, agreement, OTP and payout. MUF and BFI Finance show a generic partner form. With FundedHere, its e-seller page, its real Funding Application Form and the three ScaleUp Co-Investment steps: Apply for Co-Investment, We Pay It and Collection.\",\n    notes: ['FundedHere: hero, funded costs (stock, ads, fulfilment, up to 90%) and the three steps follow fundedhere.com/e-sellers. Form questions and options match the real form, which has no consent checkbox.', 'FundedHere: what happens after Submit is not shown on their site. The WhatsApp follow-up and store review are assumptions. Fees and repayment terms are not published, so they stay placeholders.', 'The hand-off lands on the Jamin BPKB page with the Motor or Mobil tab preselected. Tokopedia passes only UTM parameters, the collateral and a click ID.', 'Simulasi buttons skip the waiting days between milestones: verification, inspection and BPKB validation.', 'PIN, OTP and bank account screens are illustrations. Nothing is typed.', \"Generic line icons stand in for Indodana's app icons and the bank logos, since real logos stay out of the prototype.\", 'Amounts, fees and tenors are placeholders, because the deck table, the deck app screens and the Cermati pages give different figures.', 'Tokopedia tracking stops at the redirect. The last step logs the proposed partner report that matches the payout to click_id.'],\n    open: ['Indodana to confirm the hand-off lands on their side: the Jamin BPKB page in app or web, with the tab preselected.', 'Login and sign-up for new Indodana users are not in the deck. Where do they happen?', 'The deck shows form steps 1 and 2 of 3. What is step 3?', 'Motorbike survey: the deck says the customer must come to the Indodana office, the Cermati promo FAQ says home or office.', 'Flat fee or a % of approved loan? The click ID must come back in the partner report so invoices can be checked.', 'FundedHere: Tokopedia is not a platform option on its form (Shopee, TikTok Shop, Lazada, Lainnya). Add it for Tokopedia sellers?', 'FundedHere: which fees, revenue share and repayment schedule apply, and what counts as a converted lead?']\n  },\n  insurer_site: {\n    what: \"The insurer's own flow, replicated from the real Cermati insurance pages and purchase guides. Mobil (Allianz Mobilku): Komprehensif or Total Loss Only, vehicle, data diri, package (Eco, Grand or Non Paket), optional features, payment, SPPA and documents, verification and e-polis. Kesehatan: Individu or Keluarga, claim filter, registration and payment. Perjalanan: destination and dates, traveller data, payment, policy in 1 to 3 working days.\",\n    notes: ['The insurance type chosen on discovery opens that product directly. Without one, the insurer shows its product list first, with only the products it sells.', 'Same parameters as the loan redirect, with product instead of collateral. No personal data is passed.', 'Allianz car insurance is Allianz Mobilku (PT Asuransi Allianz Utama Indonesia). Package cards show only the limits both Mobilku documents agree on. The Rp300.000 deductible is from the brochure.', 'Other plan names and all premiums are placeholders. Payment and document screens are illustrations.', \"Generic icons stand in for the insurer's own icons, and its monogram for its logo.\", 'Tokopedia tracking stops at the redirect. The policy step logs the proposed partner report.'],\n    open: ['The BRD has no commercial terms for insurance leads.', 'Each insurer to confirm the products it takes through this redirect. Set up now: AXA Insurance SmartDrive, SmartMedicare and SmartTravel; Allianz Mobilku, health and travel; CAR health.', 'The Mobilku terms found come from the Maybank bancassurance brochure. Allianz to confirm the same product and limits apply to Tokopedia leads, and the vehicle age limit (the brochure says both 5 and 10 years).', 'Legal and Compliance to confirm the referral setup.', 'Renewal premiums can be paid in Premi Asuransi on Tokopedia. Ask insurers to link back from the e-polis page?']\n  },\n  cm_landing: {\n    what: 'Tokopedia by Cermati opens embedded in the app (no jump app) and mirrors the real Cermati Pinjaman dengan Jaminan list: loan simulation with Ganti, collateral tabs, sort, and product cards with Selengkapnya and Ajukan sekarang. The partner picked on discovery is marked Pilihanmu.',\n    notes: ['The collateral parameter preselects the tab: Mobil, Motor or Properti.', 'Each tab lists only partners that take that collateral, so Properti shows BFI Finance only.', 'On Cermati today, Indodana and BFI Finance are listed, BFI with BPKB Motor, BPKB Mobil and Sertifikat Rumah. Card titles follow the Cermati names. MUF is shown here as proposed.', 'Lama pinjaman runs from 6 to 60 months in 3-month steps, as on Cermati. Changing it logs simulation_change.', 'Rates, installments and limits are placeholders: Cermati, the Indodana deck and the promo page give different figures.', 'Sorting by rate needs partner rates, so the order stays as is.'],\n    open: ['BFI Jaminan Sertifikat Rumah is live on Cermati. Confirm BFI takes property leads from the Tokopedia white-label too.', \"The BRD's Cermati partner list has no multifinance collateral partner. Does each partner need a Berita Acara Penambahan?\", 'What does Tokopedia pass to Cermati at session hand-off?']\n  },\n  cm_detail: {\n    what: 'Product detail as on Cermati: Fitur utama, Syarat pengajuan (profil diri and profil kendaraan) and the documents for each applicant type.',\n    notes: ['Requirements follow the Cermati Indodana pages and the promo FAQ where they agree: age 21 to 60, Jabodetabek, car up to 10 years, motorbike up to 7 years.', 'Brand list, limit, tenor and rate stay placeholders, because the sources disagree.', 'MUF and BFI Finance terms wait for partner data. BFI figures differ between Cermati and bfi.co.id.'],\n    open: ['Rekening koran: Cermati asks every applicant for it, while the deck lists it for business owners only.', 'Who keeps the product detail current when partner terms change?']\n  },\n  cm_apply: {\n    what: 'The real Cermati Jamin BPKB lead form: name, WhatsApp, area and city, collateral type, BPKB ownership, brand and year. Sample data is prefilled.',\n    notes: ['Kota/Kabupaten shows for Jabodetabek. Non-Jabodetabek shows the Indodana coverage notice.', 'Two consents: the real one to be contacted by the partner, plus the BRD data-processing consent.', 'Ajukan sekarang stays inactive until both consents are ticked. Name and WhatsApp are validated.', 'Brand options are
